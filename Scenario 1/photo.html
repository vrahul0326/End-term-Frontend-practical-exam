<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Gallery</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f4fc;
    text-align: center;
    padding: 20px;
}

h2 {
    color: #222;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 650px;
    margin: auto;
}

.tile {
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.3s;
}

.tile:hover {
    transform: scale(1.05);
}

.lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
}

.hidden {
    display: none;
}

.big-tile {
    width: 55%;
    height: 250px;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 25px;
    font-weight: bold;
}

.close {
    position: absolute;
    top: 20px;
    right: 35px;
    color: white;
    font-size: 35px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Travel Gallery</h2>

<div class="gallery">

<div class="tile"
style="background:linear-gradient(120deg,#39c6a3,#17609c)"
onclick="openBox(this)">Mountain</div>

<div class="tile"
style="background:linear-gradient(120deg,#24c6dc,#514fe0)"
onclick="openBox(this)">Beach</div>

<div class="tile"
style="background:linear-gradient(120deg,#55b52b,#b3e66c)"
onclick="openBox(this)">Forest</div>

<div class="tile"
style="background:linear-gradient(120deg,#ff941c,#ffcc00)"
onclick="openBox(this)">Desert</div>

<div class="tile"
style="background:linear-gradient(120deg,#593d83,#485c87)"
onclick="openBox(this)">City</div>

<div class="tile"
style="background:linear-gradient(120deg,#00c6e8,#0877ed)"
onclick="openBox(this)">Lake</div>

</div>

<div class="lightbox hidden" id="lightbox">

<span class="close" onclick="closeBox()">&times;</span>

<div class="big-tile" id="bigTile"></div>

</div>

<script>

let lightbox = document.getElementById("lightbox");
let bigTile = document.getElementById("bigTile");

function openBox(tile) {

    bigTile.innerText = tile.innerText;

    bigTile.style.background = tile.style.background;

    lightbox.classList.remove("hidden");
}

function closeBox() {
    lightbox.classList.add("hidden");
}

lightbox.addEventListener("click", function(e) {

    if (e.target === lightbox) {
        closeBox();
    }

});

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {
        closeBox();
    }

});

</script>

</body>
</html>
